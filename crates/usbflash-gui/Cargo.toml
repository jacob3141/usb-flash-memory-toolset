[package]
name = "usbflash-gui"
description = "Graphical interface of the USB Flash Memory Toolset"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "usbflash-gui"
path = "src/main.rs"
# The Windows manifest demands elevation, which also applies to a test harness. There are no GUI tests.
test = false

[dependencies]
usbflash-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
egui-pop-phosphor = "0.15"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Shows made-up devices and simulated jobs. Such a build cannot touch any disk.
demo = []
