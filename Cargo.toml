[workspace]
resolver = "3"
members = ["crates/usbflash-core", "crates/usbflash-cli", "crates/usbflash-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Jacob Dawid"]
repository = "https://github.com/jacob3141/usb-flash-memory-toolset"
homepage = "https://github.com/jacob3141/usb-flash-memory-toolset"
rust-version = "1.95"
readme = "README.md"
keywords = ["usb", "flash", "wipe", "format", "disk"]
categories = ["command-line-utilities", "filesystem", "hardware-support"]

[workspace.dependencies]
usbflash-core = { path = "crates/usbflash-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
