name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_GUI_DEPS: libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup component add rustfmt clippy
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p usbflash-gui --features demo --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - name: Install GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked

  # Independent tools must accept the filesystems we create.
  validate-filesystems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - run: sudo apt-get update && sudo apt-get install -y dosfstools exfatprogs fdisk
      - run: cargo build --release --locked -p usbflash-cli
      - run: scripts/fsck-check.sh target/release/usbflash

  # Builds the real installer, and installs and uninstalls it on the runner.
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - run: cargo build --workspace --release --locked
      - run: cargo install cargo-about --locked --features cli
      - run: cargo about generate --output-file THIRD_PARTY_LICENSES.html about.hbs
      - run: choco install innosetup --no-progress -y
      - name: Build and test the installer
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq usbflash-cli).version
          $setup = scripts/build-installer.ps1 -Version $version | Select-Object -Last 1
          scripts/test-installer.ps1 -Setup $setup -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: target/installer/*.exe
          retention-days: 7

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
